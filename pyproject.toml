[project]
name = "knowledge-base"
version = "0.1.0"
description = "RAG knowledge base project"
requires-python = ">=3.11,<3.12"
dependencies = [
    "colorlog>=6.12.0",
    "dashscope>=2.1.0",
    "fastapi>=0.162.0",
    "grandalf>=0.8",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.19",
    "minio>=7.2.20",
    "numpy>=2.4.6",
    "openai-agents>=0.25.0",
    "pymilvus[model]>=2.6.0",
    "pymongo>=4.19.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.4",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]
